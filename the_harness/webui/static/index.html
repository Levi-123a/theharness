<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the-harness — 编程助手</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <span class="brand-dot"></span>
                <span class="brand-name">the-harness</span>
            </div>
            <div class="sidebar-section-label">
                <span id="session-section-title">会话列表</span>
                <button id="batch-delete-btn" class="link-btn" style="display:none;" title="批量选择并删除会话">批量删除</button>
            </div>
            <div id="batch-toolbar" class="batch-toolbar" style="display:none;">
                <span id="batch-count">已选 0 项</span>
                <div class="batch-toolbar-actions">
                    <button id="batch-confirm-btn" class="btn-small btn-danger">删除选中</button>
                    <button id="batch-cancel-btn" class="btn-small">取消</button>
                </div>
            </div>
            <ul id="session-list"></ul>
            <div id="session-empty" class="empty-state">
                <div class="empty-icon">○</div>
                <p>暂无会话记录</p>
            </div>
        </aside>

        <main id="main">
            <div id="header">
                <div id="mode-tabs">
                    <button class="tab active" data-mode="fix">修复测试</button>
                    <button class="tab" data-mode="freeform">自由模式</button>
                </div>
                <div class="header-right">
                    <span id="conn-status" class="conn-status idle">就绪</span>
                    <button id="new-chat-btn" title="开始新对话">+ 新对话</button>
                    <button id="settings-btn" title="API 密钥设置">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        设置
                    </button>
                </div>
            </div>

            <div id="chat-wrap">
                <div id="chat"></div>
            </div>

            <!-- 修复测试模式 -->
            <div id="input-bar-fix" class="input-bar">
                <input type="text" id="test-path" class="chat-input" placeholder="测试文件路径（如 tests/test_foo.py）" autocomplete="off">
                <input type="text" id="workspace" class="chat-input" placeholder="工作目录（留空为当前目录）" autocomplete="off">
                <button id="start-btn" class="send-btn">开始修复</button>
            </div>

            <!-- 自由模式 -->
            <div id="input-bar-freeform" class="input-bar chat-input-bar" style="display:none;">
                <textarea id="instruction" class="chat-input" placeholder="描述你想让助手做的事情，按 Ctrl+Enter 发送…"></textarea>
                <div class="input-bottom">
                    <input type="text" id="workspace-freeform" class="chat-input small" placeholder="工作目录（留空为当前目录）" autocomplete="off">
                    <button id="instruct-btn" class="send-btn">发送</button>
                </div>
            </div>
        </main>
    </div>

    <!-- 设置弹窗 -->
    <div id="settings-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>API 密钥设置</h3>
                <button id="modal-close" class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="cred-status-area">
                    <p id="cred-status-text">正在检查状态...</p>
                </div>

                <!-- 管理密钥 -->
                <div id="cred-manage-section">
                    <h4>已存储的密钥</h4>
                    <ul id="cred-provider-list"></ul>
                    <h4>添加 / 更新密钥</h4>
                    <input type="text" id="cred-provider-name" placeholder="服务商名称（如 openai、deepseek）" autocomplete="off">
                    <input type="text" id="cred-key-input" placeholder="API 密钥（如 sk-...）" autocomplete="off">
                    <input type="text" id="cred-base-url" placeholder="接口地址（留空使用默认值）" autocomplete="off">
                    <input type="text" id="cred-model" placeholder="模型（留空使用默认值）" autocomplete="off">
                    <button id="cred-store-btn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
